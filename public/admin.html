<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MovieAce · Settings Dashboard</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Plus+Jakarta+Sans:wght@300;400;500;700&display=swap" rel="stylesheet">
    
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        :root {
            --bg-dark: #09090b;
            --bg-card: rgba(20, 20, 25, 0.6);
            --rule: rgba(255, 255, 255, 0.08);
            --violet: #8b5cf6;
            --violet-glow: rgba(139, 92, 246, 0.35);
            --emerald: #10b981;
            --rose: #f43f5e;
            --bone-100: #f4f4f5;
            --bone-200: #e4e4e7;
            --bone-300: #a1a1aa;
            --bone-400: #71717a;
            --r-lg: 16px;
            --r-md: 12px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-dark);
            color: var(--bone-100);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            position: relative;
        }

        /* Ambient Glowing Background Orbs */
        .orb {
            position: absolute;
            width: 400px;
            height: 400px;
            border-radius: 50%;
            background: radial-gradient(circle, var(--violet-glow) 0%, rgba(9, 9, 11, 0) 70%);
            z-index: 0;
            pointer-events: none;
            filter: blur(40px);
        }
        .orb-left {
            top: -10%;
            left: -10%;
        }
        .orb-right {
            bottom: -10%;
            right: -10%;
        }

        /* Glassmorphic Container */
        .container {
            width: 100%;
            max-width: 480px;
            padding: 2.5rem;
            background: var(--bg-card);
            backdrop-filter: blur(16px) saturate(180%);
            -webkit-backdrop-filter: blur(16px) saturate(180%);
            border: 1px solid var(--rule);
            border-radius: var(--r-lg);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            z-index: 10;
            transition: var(--transition);
        }

        /* Heading Styles */
        h1 {
            font-family: 'Outfit', sans-serif;
            font-weight: 800;
            font-size: 2rem;
            letter-spacing: -0.02em;
            background: linear-gradient(135deg, #ffffff 40%, var(--bone-300) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }

        .subtitle {
            color: var(--bone-300);
            font-size: 0.925rem;
            margin-bottom: 2rem;
        }

        /* Form Controls */
        .form-group {
            margin-bottom: 1.5rem;
            position: relative;
        }

        .form-label {
            display: block;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--bone-200);
            margin-bottom: 0.5rem;
        }

        .form-input, .form-select {
            width: 100%;
            padding: 0.875rem 1rem;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--rule);
            border-radius: var(--r-md);
            color: var(--bone-100);
            font-family: inherit;
            font-size: 0.95rem;
            outline: none;
            transition: var(--transition);
        }

        .form-input:focus, .form-select:focus {
            border-color: var(--violet);
            box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.15);
            background: rgba(255, 255, 255, 0.05);
        }

        /* Primary Button */
        .btn {
            width: 100%;
            padding: 0.875rem;
            background: var(--violet);
            color: white;
            border: none;
            border-radius: var(--r-md);
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            box-shadow: 0 4px 12px rgba(139, 92, 246, 0.25);
        }

        .btn:hover {
            background: #7c3aed;
            box-shadow: 0 6px 16px rgba(139, 92, 246, 0.4);
            transform: translateY(-1px);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn:disabled {
            background: var(--bone-400);
            cursor: not-allowed;
            box-shadow: none;
        }

        /* Views (Passcode authentication vs. Dashboard) */
        .view-section {
            display: none;
        }

        .view-section.active {
            display: block;
            animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        /* Status & Feedback Toast */
        .toast {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            padding: 1rem 1.5rem;
            border-radius: var(--r-md);
            background: #18181b;
            border: 1px solid var(--rule);
            color: var(--bone-100);
            font-size: 0.9rem;
            font-weight: 500;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            display: flex;
            align-items: center;
            gap: 0.75rem;
            transform: translateY(100px);
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 100;
        }

        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }

        .toast-success {
            border-left: 4px solid var(--emerald);
        }

        .toast-error {
            border-left: 4px solid var(--rose);
        }

        /* Animations */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Quick list of sweets/servers info */
        .server-grid {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--rule);
            border-radius: var(--r-md);
            padding: 1rem;
            margin-top: 1.5rem;
            font-size: 0.825rem;
            max-height: 120px;
            overflow-y: auto;
        }

        .server-grid-item {
            display: flex;
            justify-content: space-between;
            padding: 0.25rem 0;
            color: var(--bone-300);
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
        }
        .server-grid-item:last-child {
            border-bottom: none;
        }
        .server-grid-item strong {
            color: var(--bone-200);
        }
    </style>
</head>
<body>
    <div class="orb orb-left"></div>
    <div class="orb orb-right"></div>

    <div class="container" id="widget-container">
        
        <!-- PASSCODE AUTHENTICATION VIEW -->
        <section id="auth-view" class="view-section active">
            <h1>Admin Gateway</h1>
            <p class="subtitle">Access settings dashboard to configure defaults.</p>
            <form onsubmit="handleAuthenticate(event)">
                <div class="form-group">
                    <label class="form-label" for="admin-passcode-input">Passcode</label>
                    <input type="password" id="admin-passcode-input" class="form-input" placeholder="••••••••" required autocomplete="current-password">
                </div>
                <button type="submit" class="btn" id="auth-btn">
                    <span>Unlock Dashboard</span>
                </button>
            </form>
        </section>

        <!-- DASHBOARD VIEW -->
        <section id="dashboard-view" class="view-section">
            <h1>Site Settings</h1>
            <p class="subtitle">Update default videoplayer instantly without rebuilding.</p>
            
            <form onsubmit="handleSaveSettings(event)">
                <div class="form-group">
                    <label class="form-label" for="default-provider-select">Default Stream Player</label>
                    <select id="default-provider-select" class="form-select">
                        <option value="rasmalai">Rasmalai (sweet server)</option>
                        <option value="cinemaos">Gulab Jamun (CinemaOS)</option>
                        <option value="smashy">Jalebi (SmashyStream)</option>
                        <option value="peachify">Rasgulla (Peachify)</option>
                        <option value="mappletv">Kaju Katli (MappleTV)</option>
                        <option value="vidking">Kheer (VidKing)</option>
                        <option value="videasy">Barfi (VidEasy)</option>
                        <option value="vidsrc_ru">Laddu (VidSrc.ru)</option>
                        <option value="vidsrc_su">Peda (VidSrc.su)</option>
                        <option value="vidsrcme">Gajar Ka Halwa (VidSrcMe)</option>
                        <option value="multiembed">Soan Papdi (MultiEmbed)</option>
                        <option value="vsrc">Sandesh (vsrc.su)</option>
                        <option value="vidlink">Cham Cham (VidLink)</option>
                        <option value="autoembed">Kulfi (AutoEmbed)</option>
                        <option value="vidfast">Mysore Pak (VidFast)</option>
                        <option value="movies111">Imarti (111Movies)</option>
                        <option value="vidora">Ghevar (Vidora)</option>
                    </select>
                </div>

                <div class="form-group" style="margin-top: 2rem;">
                    <label class="form-label" for="new-passcode-input">Change Passcode (Optional)</label>
                    <input type="password" id="new-passcode-input" class="form-input" placeholder="Enter new passcode to update">
                </div>

                <button type="submit" class="btn" id="save-btn" style="margin-top: 1.5rem;">
                    <span>Save Changes</span>
                </button>
            </form>

            <div class="server-grid">
                <div class="server-grid-item"><strong>ID</strong><strong>Sweet Name</strong></div>
                <div class="server-grid-item"><span>rasmalai</span><span>Rasmalai</span></div>
                <div class="server-grid-item"><span>cinemaos</span><span>Gulab Jamun</span></div>
                <div class="server-grid-item"><span>smashy</span><span>Jalebi</span></div>
                <div class="server-grid-item"><span>peachify</span><span>Rasgulla</span></div>
                <div class="server-grid-item"><span>videasy</span><span>Barfi</span></div>
                <div class="server-grid-item"><span>vidlink</span><span>Cham Cham</span></div>
            </div>
        </section>
    </div>

    <!-- Toast Alert Container -->
    <div id="toast" class="toast"></div>

    <script>
        const DEFAULT_SUPABASE_URL = 'https://eeyiragtylotiwozbgqp.supabase.co';
        const DEFAULT_SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVleWlyYWd0eWxvdGl3b3piZ3FwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkzNzAyNzYsImV4cCI6MjA5NDk0NjI3Nn0.YB_alc7kt5l09eTfNH0x5q-ayBx-dHS1qE-yzHbRTFg';

        let supabaseClient;
        let adminPasscode = 'admin123'; // fallback default passcode

        // Initialize Supabase Client dynamically
        function initSupabase() {
            let url = localStorage.getItem('supabase_url');
            let key = localStorage.getItem('supabase_key');
            if (!url || url === 'undefined' || url === 'null' || url.trim() === '') url = DEFAULT_SUPABASE_URL;
            if (!key || key === 'undefined' || key === 'null' || key.trim() === '') key = DEFAULT_SUPABASE_KEY;
            
            supabaseClient = supabase.createClient(url, key);
        }

        // Show toast alert
        function showToast(message, isSuccess = true) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = `toast show ${isSuccess ? 'toast-success' : 'toast-error'}`;
            
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        // Authenticate passcode
        async function handleAuthenticate(event) {
            event.preventDefault();
            const btn = document.getElementById('auth-btn');
            const passcodeField = document.getElementById('admin-passcode-input');
            const enteredPasscode = passcodeField.value.trim();
            
            btn.disabled = true;
            btn.textContent = 'Verifying...';

            try {
                // Fetch passcode from Supabase
                const { data, error } = await supabaseClient
                    .from('app_settings')
                    .select('value')
                    .eq('key', 'admin_passcode')
                    .single();
                
                if (data && data.value) {
                    adminPasscode = data.value;
                }

                if (enteredPasscode === adminPasscode) {
                    showToast('Access Granted!');
                    document.getElementById('auth-view').classList.remove('active');
                    document.getElementById('dashboard-view').classList.add('active');
                    loadDashboardSettings();
                } else {
                    showToast('Invalid passcode', false);
                }
            } catch (err) {
                console.error(err);
                // Try fallback passcode if DB table does not exist or has RLS error
                if (enteredPasscode === 'admin123') {
                    showToast('Unlocked (using offline fallback)');
                    document.getElementById('auth-view').classList.remove('active');
                    document.getElementById('dashboard-view').classList.add('active');
                    loadDashboardSettings();
                } else {
                    showToast('Auth error. Make sure migrations are run.', false);
                }
            } finally {
                btn.disabled = false;
                btn.textContent = 'Unlock Dashboard';
            }
        }

        // Load settings onto dashboard
        async function loadDashboardSettings() {
            try {
                const { data, error } = await supabaseClient
                    .from('app_settings')
                    .select('value')
                    .eq('key', 'default_provider')
                    .single();
                
                if (data && data.value) {
                    document.getElementById('default-provider-select').value = data.value.toLowerCase();
                }
            } catch (err) {
                console.warn('Could not retrieve current default provider:', err);
            }
        }

        // Save Settings to database
        async function handleSaveSettings(event) {
            event.preventDefault();
            const saveBtn = document.getElementById('save-btn');
            const defaultProvider = document.getElementById('default-provider-select').value;
            const newPasscode = document.getElementById('new-passcode-input').value.trim();

            saveBtn.disabled = true;
            saveBtn.textContent = 'Saving...';

            try {
                // Save default provider
                const { error: providerError } = await supabaseClient
                    .from('app_settings')
                    .upsert({ key: 'default_provider', value: defaultProvider, updated_at: new Date() }, { onConflict: 'key' });

                if (providerError) throw providerError;

                // Save new passcode if provided
                if (newPasscode) {
                    const { error: passcodeError } = await supabaseClient
                        .from('app_settings')
                        .upsert({ key: 'admin_passcode', value: newPasscode, updated_at: new Date() }, { onConflict: 'key' });
                    
                    if (passcodeError) throw passcodeError;
                    adminPasscode = newPasscode;
                    document.getElementById('new-passcode-input').value = '';
                }

                showToast('Settings updated successfully!');
            } catch (err) {
                console.error(err);
                showToast('Failed to update settings in Supabase', false);
            } finally {
                saveBtn.disabled = false;
                saveBtn.textContent = 'Save Changes';
            }
        }

        // Initialize script
        initSupabase();
    </script>
</body>
</html>
