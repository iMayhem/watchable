<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stream Player — CineStream</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            background: #000;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            color: #fff;
            overflow: hidden;
        }

        #player-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            background: #000;
        }

        /* Status Overlay */
        .status-overlay {
            position: absolute;
            inset: 0;
            z-index: 20;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #0b0a08;
            padding: 1.5rem;
            text-align: center;
        }

        .status-spinner {
            width: 44px;
            height: 44px;
            border: 3px solid rgba(255, 90, 31, 0.15);
            border-top-color: #ff5a1f;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 1.25rem;
        }

        .status-title {
            font-size: 1.25rem;
            font-weight: 600;
            margin: 0 0 0.5rem;
            color: #f5efe4;
        }

        .status-subtitle {
            font-size: 0.95rem;
            color: #9ca3af;
            max-width: 400px;
            line-height: 1.5;
            margin: 0;
        }

        .error-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* ── Plyr Custom Styling & Sleek Overrides ── */
        .plyr {
            width: 100% !important;
            height: 100% !important;
            background: #000 !important;
        }

        .plyr__video-wrapper {
            height: 100% !important;
            width: 100% !important;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .plyr-video-element {
            width: 100% !important;
            height: 100% !important;
            object-fit: contain !important;
        }

        /* Floating control bar logic for Plyr controls */
        .plyr__controls {
            background: rgba(11, 10, 8, 0.8) !important;
            backdrop-filter: blur(14px) saturate(1.2) !important;
            -webkit-backdrop-filter: blur(14px) saturate(1.2) !important;
            border: 1px solid rgba(255, 255, 255, 0.08) !important;
            border-radius: 10px !important;
            margin: 24px !important; /* Float 24px inside from all edges */
            padding: 10px 16px !important;
            position: absolute !important;
            bottom: 0 !important;
            left: 0 !important;
            right: 0 !important;
            z-index: 10 !important;
            transition: opacity 0.3s ease, transform 0.3s ease !important;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5) !important;
        }

        /* Style Plyr buttons to be warm/orange desaturated */
        .plyr__control {
            color: rgba(255, 90, 31, 0.8) !important;
            transition: color 0.2s ease, transform 0.15s ease !important;
        }

        .plyr__control:hover, .plyr__control[aria-expanded="true"] {
            background: rgba(255, 90, 31, 0.1) !important;
            color: #ff723f !important;
            filter: drop-shadow(0 0 4px rgba(255, 90, 31, 0.6)) !important;
        }

        /* Plyr progress bar slider overrides */
        .plyr__progress input[type='range'] {
            color: #ff5a1f !important;
        }
    </style>
    <!-- Plyr & HlsJS CDNs -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/plyr@3.7.8/dist/plyr.css">
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/plyr@3.7.8/dist/plyr.min.js"></script>
    <script>
      window.op=window.op||function(){var n=[];return new Proxy(function(){arguments.length&&n.push([].slice.call(arguments))},{get:function(t,r){return"q"===r?n:function(){n.push([r].concat([].slice.call(arguments)))}} ,has:function(t,r){return"q"===r}}) }();
      window.op('init', {
        clientId: '01a2e66a-a6b1-4aaf-af69-98d36e97e699',
        trackScreenViews: true,
        trackOutgoingLinks: true,
        trackAttributes: true,
      });
    </script>
    <script src="https://openpanel.dev/op1.js" defer async></script>
</head>
<body>

    <div id="player-container">
        <!-- Status Overlay -->
        <div id="status-overlay" class="status-overlay">
            <div id="status-spinner" class="status-spinner"></div>
            <div id="status-icon" class="error-icon" style="display: none;">🚨</div>
            <h2 id="status-title" class="status-title">Striking Direct Stream</h2>
            <p id="status-subtitle" class="status-subtitle">Contacting CineStream microservice resolvers...</p>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const type = urlParams.get('type') || 'movie';
        const id = urlParams.get('id') || '';
        const season = urlParams.get('season') || '1';
        const episode = urlParams.get('episode') || '1';
        const title = urlParams.get('title') || '';

        const statusOverlay = document.getElementById('status-overlay');
        const statusSpinner = document.getElementById('status-spinner');
        const statusIcon = document.getElementById('status-icon');
        const statusTitle = document.getElementById('status-title');
        const statusSubtitle = document.getElementById('status-subtitle');

        function showError(msg) {
            statusSpinner.style.display = 'none';
            statusIcon.style.display = 'block';
            statusTitle.textContent = 'Unable to strike direct stream';
            statusSubtitle.textContent = msg || 'All resolution streams returned offline status.';
        }

        async function initPlayer() {
            if (!id) {
                showError('Invalid or missing TMDB media identifier.');
                return;
            }

            try {
                // Determine API host (support localhost development)
                let apiHost = '';
                if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
                    apiHost = 'http://localhost:3000';
                }

                const resolveUrl = `${apiHost}/api/cinestream?type=${type}&id=${id}&season=${season}&episode=${episode}&title=${encodeURIComponent(title)}`;
                const res = await fetch(resolveUrl);
                
                if (!res.ok) {
                    throw new Error('Resolver returned non-ok HTTP status');
                }

                const data = await res.json();
                if (!data || !data.options || data.options.length === 0) {
                    throw new Error('No streamable mirrors were found');
                }

                // Hide loader
                statusOverlay.style.display = 'none';

                // Setup Plyr with HLS support
                const firstOption = data.options[0];
                const format = firstOption.format || 'm3u8';
                
                const video = document.createElement('video');
                video.controls = false;
                video.playsInline = true;
                video.autoplay = true;
                video.className = 'plyr-video-element';
                document.getElementById('player-container').appendChild(video);

                if (format === 'm3u8' && Hls.isSupported()) {
                    const hls = new Hls({
                        maxMaxBufferLength: 30,
                        enableWorker: true
                    });
                    hls.loadSource(firstOption.url);
                    hls.attachMedia(video);
                } else {
                    video.src = firstOption.url;
                }

                const player = new Plyr(video, {
                    autoplay: true,
                    controls: [
                        'play-large',
                        'play',
                        'progress',
                        'current-time',
                        'duration',
                        'mute',
                        'volume',
                        'settings',
                        'pip',
                        'airplay',
                        'fullscreen'
                    ],
                    settings: ['quality', 'speed', 'loop']
                });

            } catch (err) {
                showError(err.message);
            }
        }

        window.addEventListener('DOMContentLoaded', initPlayer);
    </script>
</body>
</html>
