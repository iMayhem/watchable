<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>Moovie</title>
    
    <!-- Resource Hints -->
    <link rel="dns-prefetch" href="https://image.tmdb.org/t/p/" />
    <link rel="dns-prefetch" href="https://wsrv.nl" />
    <link rel="dns-prefetch" href="https://api.themoviedb.org" />
    <link rel="preconnect" href="https://image.tmdb.org/t/p/" crossorigin />
    <link rel="preconnect" href="https://wsrv.nl" crossorigin />
    
    <style>
      *,*::before,*::after{box-sizing:border-box}*{margin:0}html{-webkit-text-size-adjust:100%;-moz-text-size-adjust:100%;text-size-adjust:100%;-webkit-tap-highlight-color:transparent}body{min-height:100vh;min-height:100dvh;background:#0b0a08;color:#f5efe4;font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}#app{isolation:isolate}

      /* Initial Mobile App Skeleton Loader */
      .app-skeleton {
        display: flex;
        flex-direction: column;
        min-height: 100vh;
        background: #0b0a08;
        padding: 0 1rem;
        box-sizing: border-box;
      }
      .app-skeleton-header {
        height: 56px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        margin-bottom: 1.5rem;
      }
      .app-skeleton-shimmer {
        position: relative;
        overflow: hidden;
      }
      .app-skeleton-shimmer::after {
        content: '';
        position: absolute;
        top: 0; right: 0; bottom: 0; left: 0;
        transform: translateX(-100%);
        background: linear-gradient(
          90deg,
          rgba(255, 255, 255, 0) 0%,
          rgba(255, 255, 255, 0.03) 20%,
          rgba(255, 255, 255, 0.07) 60%,
          rgba(255, 255, 255, 0) 100%
        );
        animation: app-shimmer-anim 1.6s infinite;
      }
      @keyframes app-shimmer-anim {
        100% { transform: translateX(100%); }
      }
      .app-skeleton-text {
        background: rgba(255, 255, 255, 0.06);
        border-radius: 4px;
      }
      .app-skeleton-logo {
        width: 100px;
        height: 20px;
        background: rgba(255, 255, 255, 0.08);
        border-radius: 4px;
      }
      .app-skeleton-nav {
        display: flex;
        gap: 1rem;
      }
      .app-skeleton-nav-item {
        width: 24px;
        height: 24px;
        background: rgba(255, 255, 255, 0.05);
        border-radius: 50%;
      }
      .app-skeleton-hero {
        height: 200px;
        background: rgba(255, 255, 255, 0.02);
        border: 1px solid rgba(255, 255, 255, 0.04);
        border-radius: 8px;
        margin-bottom: 2rem;
        padding: 1.5rem;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        gap: 0.75rem;
      }
      .app-skeleton-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 0.75rem;
      }
      .app-skeleton-card {
        aspect-ratio: 2/3;
        background: rgba(255, 255, 255, 0.02);
        border: 1px solid rgba(255, 255, 255, 0.04);
        border-radius: 6px;
      }
    </style>
    
    <!-- Early Anti-Inspect Protection -->
    <script>
      (function() {
        'use strict';
        
        document.addEventListener('contextmenu', function(e) {
          e.preventDefault();
          e.stopPropagation();
          return false;
        }, true);
        
        document.addEventListener('keydown', function(e) {
          if (e.key === 'F12') {
            e.preventDefault();
            e.stopPropagation();
            return false;
          }
          
          var meta = e.ctrlKey || e.metaKey;
          if (!meta) return;
          
          var k = (e.key || '').toUpperCase();
          
          if (e.shiftKey && (k === 'I' || k === 'J' || k === 'C' || k === 'K' || k === 'M' || k === 'E')) {
            e.preventDefault();
            e.stopPropagation();
            return false;
          }
          
          if (k === 'U' || k === 'S' || k === 'P') {
            e.preventDefault();
            e.stopPropagation();
            return false;
          }
          
          if (e.altKey && (k === 'I' || k === 'J' || k === 'C')) {
            e.preventDefault();
            e.stopPropagation();
            return false;
          }
        }, true);
        
        document.addEventListener('selectstart', function(e) {
          if (e.target.tagName !== 'INPUT' && e.target.tagName !== 'TEXTAREA') {
            e.preventDefault();
            return false;
          }
        }, true);
        
        document.addEventListener('copy', function(e) {
          e.preventDefault();
          return false;
        }, true);
        
        document.addEventListener('cut', function(e) {
          e.preventDefault();
          return false;
        }, true);
        
        document.addEventListener('dragstart', function(e) {
          e.preventDefault();
          return false;
        }, true);
        
        setInterval(function() {
          var before = new Date().getTime();
          debugger;
          var after = new Date().getTime();
          if (after - before > 100) {
            document.body.innerHTML = '<div style="position:fixed;inset:0;background:#000;color:#fff;display:flex;align-items:center;justify-content:center;font-family:sans-serif;text-align:center;padding:20px;"><div><h1>⚠️ Developer Tools Detected</h1><p>Please close developer tools and refresh the page.</p></div></div>';
          }
        }, 1000);
        
        setInterval(function() {
          try {
            console.clear();
          } catch(e) {}
        }, 1000);
      })();
    </script>
    <script>
      (function () {
        try {
          var host = location.hostname;
          if (host === 'localhost' || host === '127.0.0.1') return;
          
          var cleanHost = host.indexOf('www.') === 0 ? host.substring(4) : host;
          var q = location.search || '';
          if (/\bmobile=1\b/.test(q) || q.indexOf('mobile') !== -1) return;
          
          var desktopQ = /\bdesktop=1\b/.test(q) || q.indexOf('desktop') !== -1;
          var ua = navigator.userAgent || '';
          var mobileUa = /Android|webOS|iPhone|iPod|BlackBerry|IEMobile|Opera Mini|Mobile/i.test(ua) || /iPad|Tablet/i.test(ua);
          var touch = 'ontouchstart' in window || (navigator.maxTouchPoints || 0) > 0;
          var narrow = window.matchMedia && window.matchMedia('(max-width: 1024px)').matches;
          var tablet = touch && narrow;
          
          // If NOT mobile/tablet, redirect to the desktop site
          if (desktopQ || (!mobileUa && !tablet)) {
            var targetHost = cleanHost;
            if (cleanHost.indexOf('m.') === 0) {
              targetHost = cleanHost.substring(2);
            }
            var targetUrl = 'https://' + targetHost + location.pathname + location.search + location.hash;
            location.replace(targetUrl);
          }
        } catch (e) {}
      })();
    </script>
    <script defer src="https://cloud.umami.is/script.js" data-website-id="584702db-6988-4367-9bb3-935742c17dd4"></script>
  </head>
  <body>
    <div id="app">
      <div class="app-skeleton">
        <header class="app-skeleton-header">
          <div class="app-skeleton-logo app-skeleton-shimmer"></div>
          <div class="app-skeleton-nav">
            <div class="app-skeleton-nav-item app-skeleton-shimmer"></div>
            <div class="app-skeleton-nav-item app-skeleton-shimmer"></div>
            <div class="app-skeleton-nav-item app-skeleton-shimmer"></div>
          </div>
        </header>
        <div class="app-skeleton-hero app-skeleton-shimmer">
          <div class="app-skeleton-text app-skeleton-shimmer" style="width: 50%; height: 24px;"></div>
          <div class="app-skeleton-text app-skeleton-shimmer" style="width: 30%; height: 12px; margin-top: 0.25rem;"></div>
          <div class="app-skeleton-text app-skeleton-shimmer" style="width: 70%; height: 10px; margin-top: 0.5rem;"></div>
        </div>
        <div class="app-skeleton-grid">
          <div class="app-skeleton-card app-skeleton-shimmer"></div>
          <div class="app-skeleton-card app-skeleton-shimmer"></div>
          <div class="app-skeleton-card app-skeleton-shimmer"></div>
          <div class="app-skeleton-card app-skeleton-shimmer"></div>
          <div class="app-skeleton-card app-skeleton-shimmer"></div>
          <div class="app-skeleton-card app-skeleton-shimmer"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
