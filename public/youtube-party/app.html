<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover">
    <meta name="theme-color" content="#0b0a08">
    <meta name="robots" content="noindex, nofollow">
    <title>moovie · YouTube Watch Party</title>
    <link rel="icon" type="image/svg+xml" href="../favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..900&display=swap" rel="stylesheet">
    <link href="https://api.fontshare.com/v2/css?f[]=general-sans@200,300,400,500,600,700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="/youtube-party/party.css">
    <script>
        (function() {
            const params = new URLSearchParams(window.location.search);
            const embedded = params.get('embedded') === '1' || window.self !== window.top;
            if (embedded) document.documentElement.classList.add('yt-embedded');
        })();
    </script>
</head>
<body class="yt-booting">
    <span class="grain" aria-hidden="true"></span>
    <div class="yt-boot-splash" role="status" aria-live="polite" aria-label="Loading YouTube Watch Party">
        <div class="yt-boot-splash__spinner" aria-hidden="true"></div>
        <p class="yt-boot-splash__label">Loading YouTube Watch Party…</p>
    </div>

    <main class="yt-main">
        <!-- ROOM VIEW -->
        <section id="room-view" class="view">
            <div class="room-workspace">
                <div class="player-container">
                    <div class="workspace-banner">
                        <div class="banner-progress">
                            <button type="button" class="back-btn" onclick="navigateParentSite('/', event)" title="Home">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9.5 12 3l9 6.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1V9.5z"/></svg>
                                Home
                            </button>
                            <div id="presence-faces" class="presence-faces"></div>
                        </div>
                        <div style="display:flex;gap:0.5rem;align-items:center">
                            <button type="button" id="skip-btn" class="skip-btn" onclick="voteSkip()" style="display:none">Skip</button>
                            <button type="button" class="yt-search-btn" onclick="openYtSearch()" title="Search YouTube">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                                Search
                            </button>
                            <button type="button" class="cinema-mode-btn" onclick="toggleCinemaMode()">Cinema mode</button>
                            <button type="button" class="btn btn-sm" onclick="copyShareLink()" style="background:transparent;border:1px solid var(--rule);color:var(--ember)">Invite</button>
                        </div>
                    </div>

                    <div class="player-stage" id="player-stage">
                        <div id="yt-player-wrap">
                            <div id="yt-player"></div>
                        </div>
                    </div>

                </div>

                <div class="sidebar">
                    <div class="sidebar-header">
                        <div class="chat-title-group">
                            <div class="chat-status-dot"></div>
                            <span class="chat-panel-title">Party Chat</span>
                        </div>
                        <div class="chat-user-status">
                            <strong id="chat-my-name">Guest</strong> (<span id="chat-online-count">0</span>)
                        </div>
                    </div>
                    <div class="sidebar-queue">
                        <div class="queue-header">
                            <span class="queue-header-label">Up Next</span>
                            <span class="queue-header-count" id="queue-count">0</span>
                        </div>
                        <div id="queue-list" class="queue-list"></div>
                    </div>
                    <div class="sidebar-content">
                        <div id="chat-box" class="chat-messages"></div>
                        <div id="chat-emoji-picker" class="chat-emoji-picker">
                            <div class="emoji-grid">
                                <div class="emoji-group">
                                    <span class="emoji-category">Faces</span>
                                    <div class="emoji-items">
                                        <span class="emoji-item" onclick="insertEmoji('😀')">😀</span>
                                        <span class="emoji-item" onclick="insertEmoji('😎')">😎</span>
                                        <span class="emoji-item" onclick="insertEmoji('😱')">😱</span>
                                        <span class="emoji-item" onclick="insertEmoji('🥺')">🥺</span>
                                        <span class="emoji-item" onclick="insertEmoji('😂')">😂</span>
                                        <span class="emoji-item" onclick="insertEmoji('🥳')">🥳</span>
                                    </div>
                                </div>
                                <div class="emoji-group">
                                    <span class="emoji-category">Reactions</span>
                                    <div class="emoji-items">
                                        <span class="emoji-item" onclick="insertEmoji('🔥')">🔥</span>
                                        <span class="emoji-item" onclick="insertEmoji('💯')">💯</span>
                                        <span class="emoji-item" onclick="insertEmoji('🍿')">🍿</span>
                                        <span class="emoji-item" onclick="insertEmoji('👏')">👏</span>
                                        <span class="emoji-item" onclick="insertEmoji('🎉')">🎉</span>
                                        <span class="emoji-item" onclick="insertEmoji('💖')">💖</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <form id="chat-form" onsubmit="handleSendChat(event)" class="chat-input-container">
                            <button type="button" class="chat-emoji-btn" onclick="toggleEmojiPicker(event)" aria-label="Emoji">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><path d="M8 14s1.5 2 4 2 4-2 4-2"></path><line x1="9" y1="9" x2="9.01" y2="9"></line><line x1="15" y1="9" x2="15.01" y2="9"></line></svg>
                            </button>
                            <input type="text" id="chat-input" class="chat-text-input" placeholder="Say something..." autocomplete="off">
                            <button type="submit" class="chat-send-btn" aria-label="Send">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <!-- YouTube Search Overlay -->
    <div id="yt-search-overlay" class="yt-search-overlay">
        <button type="button" class="yt-search-close" onclick="closeYtSearch()">&times;</button>
        <div class="yt-search-panel">
            <div class="yt-search-input-wrap">
                <input type="text" id="yt-search-input" placeholder="Search YouTube videos..." autocomplete="off" onkeydown="if(event.key==='Enter'){event.preventDefault();searchYoutube()}">
                <button type="button" class="btn btn-primary btn-sm" onclick="searchYoutube()">Search</button>
            </div>
            <div id="yt-search-results" class="yt-results-grid"></div>
        </div>
    </div>

    <div id="toast" class="toast"></div>

    <script src="/youtube-party/party.js" defer></script>
</body>
</html>
