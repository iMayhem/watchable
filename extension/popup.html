<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Moovie Stream Boost</title>
    <style>
      * { box-sizing: border-box; margin: 0; }
      body {
        width: 280px;
        padding: 14px;
        font: 13px/1.45 system-ui, sans-serif;
        background: #0b0f18;
        color: #e8eef8;
      }
      h1 { font-size: 15px; margin-bottom: 6px; }
      p { color: #9eb0c8; margin-bottom: 8px; }
      .ok {
        display: inline-block;
        padding: 2px 8px;
        border-radius: 999px;
        background: rgba(78, 181, 255, 0.15);
        color: #8fd0ff;
        font-size: 11px;
        margin-bottom: 10px;
      }
      ul { padding-left: 18px; color: #b8c4d8; }
      li { margin-bottom: 4px; }
    </style>
  </head>
  <body>
    <h1>Moovie Stream Boost</h1>
    <span class="ok">Active</span>
    <p>Injects CDN referer headers so moovie.fun can play MP4s directly — no proxy hop.</p>
    <ul>
      <li>Open <strong>moovie.fun/test</strong></li>
      <li>Click <strong>Resolve &amp; Play</strong></li>
      <li>Uses direct CDN when extension is detected</li>
    </ul>
  </body>
</html>
