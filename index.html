    <script>
      (function () {
        try {
          var host = (location.hostname || '').toLowerCase();
          var apex = host.replace(/^www\./i, '');
          if (apex === 'localhost' || apex === '127.0.0.1' || apex.indexOf('m.') === 0) return;
          if (apex !== 'moovie.fun') return;

          var path = location.pathname;
          if (path.indexOf('/api/') === 0 || path.indexOf('/party') === 0 || /\.[a-z0-9]+$/i.test(path)) return;
          if (/^\/nf(\/|$)/.test(path) || /^\/stream\/nf(\/|$)/.test(path) || /^\/embed\/nf(\/|$)/.test(path)) {
            path = '/';
          }

          var q = location.search || '';
          if (/\bdesktop=1\b/i.test(q) || /desktop/i.test(q)) return;

          var ua = navigator.userAgent || '';
          var mobileUa = /Android|webOS|iPhone|iPod|BlackBerry|IEMobile|Opera Mini|Mobile|iPad|Tablet/i.test(ua);
          var uaDataMobile = navigator.userAgentData && navigator.userAgentData.mobile;
          var touch = 'ontouchstart' in window || (navigator.maxTouchPoints || 0) > 0;
          var narrow = window.matchMedia && window.matchMedia('(max-width: 1024px)').matches;
          var tablet = touch && narrow;

          if (uaDataMobile || mobileUa || tablet || /\bmobile=1\b/i.test(q)) {
            location.replace('https://m.' + apex + path + location.search + location.hash);
          }
        } catch (e) {}
      })();
    </script>
    <script>
      (function () {
        try {
          var path = location.pathname;
          var nf =
            /^\/nf(\/|$)/.test(path) ||
            /^\/stream\/nf(\/|$)/.test(path) ||
            /^\/embed\/nf(\/|$)/.test(path);
          var mode = '';
          try {
            mode = localStorage.getItem('movora_content_mode') || '';
          } catch (e) {}
          var homeNf = path === '/' && mode === 'netflix';
          if (!nf && !homeNf) return;

          var host = (location.hostname || '').toLowerCase();
          if (host === 'localhost' || host === '127.0.0.1') {
            try {
              if (localStorage.getItem('bot_guard_test') !== '1') return;
            } catch (e) {
              return;
            }
          }

          var ua = navigator.userAgent || '';
          var bot =
            /bot|crawler|spider|robot|crawling|lighthouse|headless|phantom|selenium|puppeteer|playwright|bytespider|petalbot|gptbot|claudebot|anthropic/i.test(
              ua
            ) || navigator.webdriver;
          if (!bot) return;

          document.documentElement.className += ' nf-bot-blocked';
          document.addEventListener(
            'DOMContentLoaded',
            function () {
              if (document.querySelector('.nf-bot-overlay')) return;
              var overlay = document.createElement('div');
              overlay.className = 'nf-bot-overlay';
              overlay.setAttribute('role', 'alert');
              overlay.innerHTML =
                '<div class="nf-bot-overlay__panel"><p class="nf-bot-overlay__eyebrow">Catalogue access</p><h1 class="nf-bot-overlay__title">Automated access blocked</h1><p class="nf-bot-overlay__copy">This catalogue section is not available to crawlers or automated browsers. Open Moovie in a regular browser to continue.</p></div>';
              document.body.appendChild(overlay);
            },
            { once: true }
          );
        } catch (e) {}
      })();
    </script>

      html.nf-bot-blocked,

      .nf-bot-overlay {

        color: rgba(245, 239, 228, 0.78);
      }
    </style>
