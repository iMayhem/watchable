<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function () {
        try {
          var host = (location.hostname || '').toLowerCase();
          var apex = host.replace(/^www\./i, '');
          if (apex === 'localhost' || apex === '127.0.0.1' || apex.indexOf('m.') === 0) return;
          if (apex !== 'moovie.fun') return;

          var path = location.pathname;
          if (path.indexOf('/api/') === 0 || path.indexOf('/party') === 0 || /\.[a-z0-9]+$/i.test(path)) return;
          if (/^\/nf(\/|$)/.test(path) || /^\/stream\/nf(\/|$)/.test(path) || /^\/embed\/nf(\/|$)/.test(path)) {
            path = '/';
          }

          var q = location.search || '';
          if (/\bdesktop=1\b/i.test(q) || /desktop/i.test(q)) return;

          var ua = navigator.userAgent || '';
          var mobileUa = /Android|webOS|iPhone|iPod|BlackBerry|IEMobile|Opera Mini|Mobile|iPad|Tablet/i.test(ua);
          var uaDataMobile = navigator.userAgentData && navigator.userAgentData.mobile;
          var touch = 'ontouchstart' in window || (navigator.maxTouchPoints || 0) > 0;
          var narrow = window.matchMedia && window.matchMedia('(max-width: 1024px)').matches;
          var tablet = touch && narrow;

          if (uaDataMobile || mobileUa || tablet || /\bmobile=1\b/i.test(q)) {
            location.replace('https://m.' + apex + path + location.search + location.hash);
          }
        } catch (e) {}
      })();
    </script>
