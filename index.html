    <!-- Critical CSS - Inline minimal styles for faster FCP -->
    <style>
      /* Critical above-the-fold styles */
      *,*::before,*::after{box-sizing:border-box}*{margin:0}html{-webkit-text-size-adjust:100%;-moz-text-size-adjust:100%;text-size-adjust:100%;-webkit-tap-highlight-color:transparent}body{min-height:100vh;min-height:100dvh;background:#0b0a08;color:#f5efe4;font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}#app{isolation:isolate}.app-stage{position:relative;min-height:100vh;min-height:100dvh;isolation:isolate}

      /* Initial App Skeleton Loader */
      .app-skeleton {
        display: flex;
        flex-direction: column;
        min-height: 100vh;
        background: #0b0a08;
        padding: 0 2rem;
        box-sizing: border-box;
      }
      .app-skeleton-header {
        height: 64px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        margin-bottom: 2rem;
      }
      .app-skeleton-shimmer {
        position: relative;
        overflow: hidden;
      }
      .app-skeleton-shimmer::after {
        content: '';
        position: absolute;
        top: 0; right: 0; bottom: 0; left: 0;
        transform: translateX(-100%);
        background: linear-gradient(
          90deg,
          rgba(255, 255, 255, 0) 0%,
          rgba(255, 255, 255, 0.03) 20%,
          rgba(255, 255, 255, 0.07) 60%,
          rgba(255, 255, 255, 0) 100%
        );
        animation: app-shimmer-anim 1.6s infinite;
      }
      @keyframes app-shimmer-anim {
        100% { transform: translateX(100%); }
      }
      .app-skeleton-text {
        background: rgba(255, 255, 255, 0.06);
        border-radius: 4px;
      }
      .app-skeleton-logo {
        width: 120px;
        height: 24px;
        background: rgba(255, 255, 255, 0.08);
        border-radius: 4px;
      }
      .app-skeleton-nav {
        display: flex;
        gap: 1.5rem;
      }
      .app-skeleton-nav-item {
        width: 70px;
        height: 16px;
        background: rgba(255, 255, 255, 0.05);
        border-radius: 4px;
      }
      .app-skeleton-hero {
        height: 380px;
        background: rgba(255, 255, 255, 0.02);
        border: 1px solid rgba(255, 255, 255, 0.04);
        border-radius: 12px;
        margin-bottom: 3rem;
        padding: 2.5rem;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        gap: 1rem;
      }
      .app-skeleton-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
        gap: 1.5rem;
      }
      .app-skeleton-card {
        aspect-ratio: 2/3;
        background: rgba(255, 255, 255, 0.02);
        border: 1px solid rgba(255, 255, 255, 0.04);
        border-radius: 8px;
      }
    </style>
    
    <!-- Early Anti-Inspect Protection (runs before any other scripts) -->
    <script>
      (function() {
        'use strict';
        
        // Disable right-click immediately
        document.addEventListener('contextmenu', function(e) {
          e.preventDefault();
          e.stopPropagation();
          return false;
        }, true);
        
        // Disable key shortcuts immediately
        document.addEventListener('keydown', function(e) {
          // F12
          if (e.key === 'F12') {
            e.preventDefault();
            e.stopPropagation();
            return false;
          }
          
          var meta = e.ctrlKey || e.metaKey;
          if (!meta) return;
          
          var k = (e.key || '').toUpperCase();
          
          // Block DevTools shortcuts
          if (e.shiftKey && (k === 'I' || k === 'J' || k === 'C' || k === 'K' || k === 'M' || k === 'E')) {
            e.preventDefault();
            e.stopPropagation();
            return false;
          }
          
          // Block view source, save, print
          if (k === 'U' || k === 'S' || k === 'P') {
            e.preventDefault();
            e.stopPropagation();
            return false;
          }
          
          // Block Alt combinations
          if (e.altKey && (k === 'I' || k === 'J' || k === 'C')) {
            e.preventDefault();
            e.stopPropagation();
            return false;
          }
        }, true);
        
        // Disable text selection
        document.addEventListener('selectstart', function(e) {
          if (e.target.tagName !== 'INPUT' && e.target.tagName !== 'TEXTAREA') {
            e.preventDefault();
            return false;
          }
        }, true);
        
        // Disable copy/cut/paste
        document.addEventListener('copy', function(e) {
          e.preventDefault();
          return false;
        }, true);
        
        document.addEventListener('cut', function(e) {
          e.preventDefault();
          return false;
        }, true);
        
        // Disable drag
        document.addEventListener('dragstart', function(e) {
          e.preventDefault();
          return false;
        }, true);
        
        // Detect DevTools via debugger trap
        setInterval(function() {
          var before = new Date().getTime();
          // eslint-disable-next-line no-debugger
          debugger;
          var after = new Date().getTime();
          if (after - before > 100) {
            // DevTools detected - redirect or show warning
            document.body.innerHTML = '<div style="position:fixed;inset:0;background:#000;color:#fff;display:flex;align-items:center;justify-content:center;font-family:sans-serif;text-align:center;padding:20px;"><div><h1>⚠️ Developer Tools Detected</h1><p>Please close developer tools and refresh the page.</p></div></div>';
          }
        }, 1000);
        
        // Clear console periodically
        setInterval(function() {
          try {
            console.clear();
          } catch(e) {}
        }, 1000);
        
      })();
    </script>
    
    <script>
      (function () {
        try {
          var host = location.hostname;
          if (host === 'localhost' || host === '127.0.0.1') return;
          
          var cleanHost = host.indexOf('www.') === 0 ? host.substring(4) : host;
          var path = location.pathname;
          if (path.indexOf('/api/') === 0 || path.indexOf('/party') === 0 || /\.[a-z0-9]+$/i.test(path)) return;
          
          var q = location.search || '';
          if (/\bdesktop=1\b/.test(q) || q.indexOf('desktop') !== -1) return;
          var mobileQ = /\bmobile=1\b/.test(q) || q.indexOf('mobile') !== -1;
          var ua = navigator.userAgent || '';
          var mobileUa = /Android|webOS|iPhone|iPod|BlackBerry|IEMobile|Opera Mini|Mobile/i.test(ua) || /iPad|Tablet/i.test(ua);
          var touch = 'ontouchstart' in window || (navigator.maxTouchPoints || 0) > 0;
          var narrow = window.matchMedia && window.matchMedia('(max-width: 1024px)').matches;
          var tablet = touch && narrow;
          if (mobileQ || mobileUa || tablet) {
            var targetHost = cleanHost.indexOf('m.') === 0 ? cleanHost : 'm.' + cleanHost;
            var targetUrl = 'https://' + targetHost + path + location.search + location.hash;
            location.replace(targetUrl);
          }
        } catch (e) {}
      })();
    </script>
