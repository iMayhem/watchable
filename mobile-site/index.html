    <style>
      *,*::before,*::after{box-sizing:border-box}*{margin:0}html{-webkit-text-size-adjust:100%;-moz-text-size-adjust:100%;text-size-adjust:100%;-webkit-tap-highlight-color:transparent}body{min-height:100vh;min-height:100dvh;background:#0b0a08;color:#f5efe4;font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}#app{isolation:isolate}

      /* Initial Mobile App Skeleton Loader */
      .app-skeleton {
        display: flex;
        flex-direction: column;
        min-height: 100vh;
        background: #0b0a08;
        padding: 0 1rem;
        box-sizing: border-box;
      }
      .app-skeleton-header {
        height: 56px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        margin-bottom: 1.5rem;
      }
      .app-skeleton-shimmer {
        position: relative;
        overflow: hidden;
      }
      .app-skeleton-shimmer::after {
        content: '';
        position: absolute;
        top: 0; right: 0; bottom: 0; left: 0;
        transform: translateX(-100%);
        background: linear-gradient(
          90deg,
          rgba(255, 255, 255, 0) 0%,
          rgba(255, 255, 255, 0.03) 20%,
          rgba(255, 255, 255, 0.07) 60%,
          rgba(255, 255, 255, 0) 100%
        );
        animation: app-shimmer-anim 1.6s infinite;
      }
      @keyframes app-shimmer-anim {
        100% { transform: translateX(100%); }
      }
      .app-skeleton-text {
        background: rgba(255, 255, 255, 0.06);
        border-radius: 4px;
      }
      .app-skeleton-logo {
        width: 100px;
        height: 20px;
        background: rgba(255, 255, 255, 0.08);
        border-radius: 4px;
      }
      .app-skeleton-nav {
        display: flex;
        gap: 1rem;
      }
      .app-skeleton-nav-item {
        width: 24px;
        height: 24px;
        background: rgba(255, 255, 255, 0.05);
        border-radius: 50%;
      }
      .app-skeleton-hero {
        height: 200px;
        background: rgba(255, 255, 255, 0.02);
        border: 1px solid rgba(255, 255, 255, 0.04);
        border-radius: 8px;
        margin-bottom: 2rem;
        padding: 1.5rem;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        gap: 0.75rem;
      }
      .app-skeleton-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 0.75rem;
      }
      .app-skeleton-card {
        aspect-ratio: 2/3;
        background: rgba(255, 255, 255, 0.02);
        border: 1px solid rgba(255, 255, 255, 0.04);
        border-radius: 6px;
      }
    </style>
    
    <script>
      (function () {
        try {
          var host = (location.hostname || '').toLowerCase();
          if (host === 'localhost' || host === '127.0.0.1') return;
          
          var cleanHost = host.replace(/^www\./i, '');
          var q = location.search || '';
          if (/\bmobile=1\b/.test(q) || q.indexOf('mobile') !== -1) return;
          
          var desktopQ = /\bdesktop=1\b/.test(q) || q.indexOf('desktop') !== -1;
          var ua = navigator.userAgent || '';
          var mobileUa = /Android|webOS|iPhone|iPod|BlackBerry|IEMobile|Opera Mini|Mobile/i.test(ua) || /iPad|Tablet/i.test(ua);
          var touch = 'ontouchstart' in window || (navigator.maxTouchPoints || 0) > 0;
          var narrow = window.matchMedia && window.matchMedia('(max-width: 1024px)').matches;
          var tablet = touch && narrow;
          
          var path = location.pathname;
          if (path.indexOf('/party') === 0 || /\.[a-z0-9]+$/i.test(path)) return;
          if (/^\/nf(\/|$)/.test(path) || /^\/stream\/nf(\/|$)/.test(path) || /^\/embed\/nf(\/|$)/.test(path)) {
            path = '/';
          }

          // If NOT mobile/tablet, redirect to the desktop site
          if (desktopQ || (!mobileUa && !tablet)) {
            var targetHost = cleanHost;
            if (cleanHost.indexOf('m.') === 0) {
              targetHost = cleanHost.substring(2);
            }
            var targetUrl = 'https://' + targetHost + path + location.search + location.hash;
            location.replace(targetUrl);
          } else if (path !== location.pathname) {
            location.replace(path + location.search + location.hash);
          }
        } catch (e) {}
      })();
    </script>
