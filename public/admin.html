<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MovieAce · Settings Dashboard</title>
        <!-- Google Fonts & Fontshare -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link href="https://api.fontshare.com/v2/css?f[]=general-sans@200,300,400,500,600,700&display=swap" rel="stylesheet">
    
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        :root {
            --bg-dark: #0b0a08;
            --bg-card: rgba(19, 17, 14, 0.7);
            --rule: rgba(245, 239, 228, 0.08);
            --rule-strong: rgba(245, 239, 228, 0.16);
            --ember: #ff5a1f;
            --ember-600: #e84817;
            --ember-glow: rgba(255, 90, 31, 0.3);
            --success: #6ba368;
            --danger: #c94e3d;
            --bone-50: #f5efe4;
            --bone-100: #e8e1d3;
            --bone-200: #c7bfb0;
            --bone-300: #a79f8d;
            --bone-400: #8a8270;
            --font-display: 'Fraunces', serif;
            --font-ui: 'General Sans', system-ui, sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
            --r-lg: 14px;
            --r-md: 8px;
            --transition: all 0.32s cubic-bezier(0.22, 1, 0.36, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-ui);
            background-color: var(--bg-dark);
            color: var(--bone-100);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            position: relative;
        }

        /* Ambient Glowing Background Orbs matching Lumiere spot orange */
        .orb {
            position: absolute;
            width: 500px;
            height: 500px;
            border-radius: 50%;
            background: radial-gradient(circle, var(--ember-glow) 0%, rgba(11, 10, 8, 0) 70%);
            z-index: 0;
            pointer-events: none;
            filter: blur(60px);
        }
        .orb-left {
            top: -15%;
            left: -15%;
        }
        .orb-right {
            bottom: -15%;
            right: -15%;
        }

        /* Glassmorphic Container matching stream-frame style */
        .container {
            width: 100%;
            max-width: 480px;
            padding: 2.75rem;
            background: var(--bg-card);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border: 1px solid var(--rule);
            border-radius: var(--r-lg);
            box-shadow: 0 32px 80px rgba(0, 0, 0, 0.6), 0 0 60px rgba(255, 90, 31, 0.08);
            z-index: 10;
            transition: var(--transition);
        }

        /* Heading Styles - Editorial display serif */
        h1 {
            font-family: var(--font-display);
            font-weight: 500;
            font-size: 2.25rem;
            letter-spacing: -0.02em;
            color: var(--bone-50);
            margin-bottom: 0.5rem;
            font-variation-settings: 'opsz' 72, 'SOFT' 50;
        }

        .subtitle {
            color: var(--bone-300);
            font-size: 0.9rem;
            margin-bottom: 2rem;
            line-height: 1.5;
        }

        /* Form Controls */
        .form-group {
            margin-bottom: 1.5rem;
            position: relative;
        }

        .form-label {
            display: block;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--bone-400);
            margin-bottom: 0.5rem;
        }

        .form-input, .form-select {
            width: 100%;
            padding: 0.875rem 1rem;
            background: rgba(245, 239, 228, 0.03);
            border: 1px solid var(--rule);
            border-radius: var(--r-md);
            color: var(--bone-100);
            font-family: inherit;
            font-size: 0.95rem;
            outline: none;
            transition: var(--transition);
        }

        /* Customize select arrow styling for premium look */
        .form-select {
            appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23c7bfb0' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 1rem center;
            background-size: 1em;
            padding-right: 2.5rem;
        }

        .form-input:focus, .form-select:focus {
            border-color: var(--ember);
            box-shadow: 0 0 0 3px rgba(255, 90, 31, 0.15);
            background: rgba(245, 239, 228, 0.05);
        }

        /* Primary Button using Ember red-orange */
        .btn {
            width: 100%;
            padding: 0.875rem;
            background: var(--ember);
            color: var(--bg-dark);
            border: none;
            border-radius: var(--r-md);
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            box-shadow: 0 4px 12px rgba(255, 90, 31, 0.25);
        }

        .btn:hover {
            background: var(--ember-600);
            box-shadow: 0 6px 16px rgba(255, 90, 31, 0.4);
            transform: translateY(-1px);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn:disabled {
            background: var(--bone-400);
            color: var(--bg-dark);
            cursor: not-allowed;
            box-shadow: none;
        }

        /* Views (Passcode authentication vs. Dashboard) */
        .view-section {
            display: none;
        }

        .view-section.active {
            display: block;
            animation: fadeIn 0.4s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }

        /* Status & Feedback Toast */
        .toast {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            padding: 1rem 1.5rem;
            border-radius: var(--r-md);
            background: var(--bg-card);
            border: 1px solid var(--rule);
            color: var(--bone-100);
            font-size: 0.9rem;
            font-weight: 500;
            backdrop-filter: blur(12px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            gap: 0.75rem;
            transform: translateY(100px);
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.22, 1, 0.36, 1);
            z-index: 100;
        }

        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }

        .toast-success {
            border-left: 4px solid var(--success);
        }

        .toast-error {
            border-left: 4px solid var(--danger);
        }

        /* Animations */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Server list grid info */
        .server-grid {
            background: rgba(245, 239, 228, 0.02);
            border: 1px solid var(--rule);
            border-radius: var(--r-md);
            padding: 1.25rem;
            margin-top: 2rem;
            font-family: var(--font-mono);
            font-size: 0.775rem;
            max-height: 140px;
            overflow-y: auto;
        }

        .server-grid::-webkit-scrollbar {
            width: 4px;
        }
        .server-grid::-webkit-scrollbar-thumb {
            background: var(--rule-strong);
            border-radius: var(--r-pill);
        }

        .server-grid-item {
            display: flex;
            justify-content: space-between;
            padding: 0.35rem 0;
            color: var(--bone-300);
            border-bottom: 1px solid rgba(245, 239, 228, 0.04);
        }
        .server-grid-item:last-child {
            border-bottom: none;
        }
        .server-grid-item strong {
            color: var(--bone-100);
            text-transform: uppercase;
            font-size: 0.8rem;
            letter-spacing: 0.05em;
        }
        .server-grid-item span:first-child {
            color: var(--ember);
        }

        /* 4K Curation Panel Styles */
        .curation-section {
            margin-top: 2.5rem;
            border-top: 1px solid var(--rule);
            padding-top: 2rem;
            text-align: left;
        }

        .section-title {
            font-family: var(--font-display);
            font-size: 1.5rem;
            color: var(--bone-50);
            margin-bottom: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        #curation-count {
            font-family: var(--font-mono);
            font-size: 0.85rem;
            color: var(--bone-400);
        }

        .search-container {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1rem;
            flex-wrap: wrap;
        }

        .search-results {
            list-style: none;
            background: rgba(245, 239, 228, 0.02);
            border: 1px solid var(--rule);
            border-radius: var(--r-md);
            margin-bottom: 1.5rem;
            padding: 0.25rem 0;
        }

        .search-item, .curation-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.75rem 1rem;
            border-bottom: 1px solid var(--rule);
            gap: 1rem;
        }

        .search-item:last-child, .curation-item:last-child {
            border-bottom: none;
        }

        .item-details {
            flex: 1;
            min-width: 0;
            text-align: left;
        }

        .item-title {
            font-weight: 500;
            font-size: 0.9rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: var(--bone-100);
        }

        .item-meta {
            font-size: 0.75rem;
            color: var(--bone-400);
            margin-top: 0.15rem;
        }

        .btn-sm {
            padding: 0.4rem 0.8rem;
            font-size: 0.8rem;
            width: auto;
            box-shadow: none;
        }

        .curation-list {
            list-style: none;
            background: rgba(245, 239, 228, 0.02);
            border: 1px solid var(--rule);
            border-radius: var(--r-md);
            margin-bottom: 1.5rem;
        }

        .curation-item {
            background: rgba(245, 239, 228, 0.01);
        }

        .curation-actions {
            display: flex;
            gap: 0.25rem;
        }

        .action-icon-btn {
            background: transparent;
            border: none;
            color: var(--bone-300);
            cursor: pointer;
            padding: 0.25rem;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.85rem;
            width: 28px;
            height: 28px;
            transition: var(--transition);
        }

        .action-icon-btn:hover:not(:disabled) {
            background: rgba(255, 255, 255, 0.08);
            color: var(--bone-50);
        }

        .action-icon-btn:disabled {
            opacity: 0.25;
            cursor: not-allowed;
        }

        .action-icon-btn.danger:hover {
            color: #ff8a80;
            background: rgba(197, 78, 61, 0.15);
        }
    </style>
</head>
<body>
    <div class="orb orb-left"></div>
    <div class="orb orb-right"></div>

    <div class="container" id="widget-container">
        
        <!-- PASSCODE AUTHENTICATION VIEW -->
        <section id="auth-view" class="view-section active">
            <h1>Admin Gateway</h1>
            <p class="subtitle">Access settings dashboard to configure defaults.</p>
            <form onsubmit="handleAuthenticate(event)">
                <div class="form-group">
                    <label class="form-label" for="admin-passcode-input">Passcode</label>
                    <input type="password" id="admin-passcode-input" class="form-input" placeholder="••••••••" required autocomplete="current-password">
                </div>
                <button type="submit" class="btn" id="auth-btn">
                    <span>Unlock Dashboard</span>
                </button>
            </form>
        </section>

        <!-- DASHBOARD VIEW -->
        <section id="dashboard-view" class="view-section">
            <h1>Site Settings</h1>
            <p class="subtitle">Update default videoplayer instantly without rebuilding.</p>
            
            <form onsubmit="handleSaveSettings(event)">
                <div class="form-group">
                    <label class="form-label" for="default-provider-select">Default Stream Player</label>
                    <select id="default-provider-select" class="form-select">
                        <option value="rasmalai">Rasmalai (sweet server)</option>
                        <option value="cinemaos">Gulab Jamun (CinemaOS)</option>
                        <option value="smashy">Jalebi (SmashyStream)</option>
                        <option value="mappletv">Kaju Katli (MappleTV)</option>
                        <option value="vidking">Kheer (VidKing)</option>
                        <option value="videasy">Barfi (VidEasy)</option>
                        <option value="vidsrc_ru">Laddu (VidSrc.ru)</option>
                        <option value="vidsrc_su">Peda (VidSrc.su)</option>
                        <option value="vidsrcme">Gajar Ka Halwa (VidSrcMe)</option>
                        <option value="multiembed">Soan Papdi (MultiEmbed)</option>
                        <option value="vsrc">Sandesh (vsrc.su)</option>
                        <option value="vidlink">Cham Cham (VidLink)</option>
                        <option value="autoembed">Kulfi (AutoEmbed)</option>
                        <option value="vidfast">Mysore Pak (VidFast)</option>
                        <option value="movies111">Imarti (111Movies)</option>
                        <option value="vidora">Ghevar (Vidora)</option>
                    </select>
                </div>

                <div class="form-group" style="margin-top: 2rem;">
                    <label class="form-label" for="tmdb-quality-select">TMDB Image Quality</label>
                    <select id="tmdb-quality-select" class="form-select">
                        <option value="low">Low - faster, smaller poster and backdrop images</option>
                        <option value="medium" selected>Medium - balanced image quality</option>
                        <option value="high">High - sharpest images, heavier bandwidth</option>
                    </select>
                </div>

                <div class="form-group" style="margin-top: 2rem;">
                    <label class="form-label" for="new-passcode-input">Change Passcode (Optional)</label>
                    <input type="password" id="new-passcode-input" class="form-input" placeholder="Enter new passcode to update">
                </div>

                <button type="submit" class="btn" id="save-btn" style="margin-top: 1.5rem;">
                    <span>Save Changes</span>
                </button>
            </form>

            <!-- 4K Curation Section -->
            <div class="curation-section">
                <h2 class="section-title">4K Selection Curation <span id="curation-count">(0/10)</span></h2>
                
                <!-- Search panel to query TMDB -->
                <form onsubmit="handleSearch4K(event)" class="search-container">
                    <input type="text" id="search-4k-input" class="form-input" placeholder="Search movies to add..." autocomplete="off">
                    <button type="submit" class="btn btn-sm" style="width: auto;">Search</button>
                </form>

                <!-- Search Results Box -->
                <ul id="search-4k-results" class="search-results" style="display: none; max-height: 160px; overflow-y: auto; list-style: none; margin-bottom: 1rem;">
                </ul>

                <!-- Selected Curation List -->
                <ul id="curation-4k-list" class="curation-list">
                    <li style="padding: 1.5rem; text-align: center; color: var(--bone-400); font-size: 0.9rem;">No 4K movies selected yet</li>
                </ul>

                <button type="button" class="btn" id="save-4k-btn" onclick="handleSave4K(event)">
                    <span>Save 4K Curation</span>
                </button>
            </div>

            <div class="server-grid">
                <div class="server-grid-item"><strong>ID</strong><strong>Sweet Name</strong></div>
                <div class="server-grid-item"><span>rasmalai</span><span>Rasmalai</span></div>
                <div class="server-grid-item"><span>cinemaos</span><span>Gulab Jamun</span></div>
                <div class="server-grid-item"><span>smashy</span><span>Jalebi</span></div>
                <div class="server-grid-item"><span>videasy</span><span>Barfi</span></div>
                <div class="server-grid-item"><span>vidlink</span><span>Cham Cham</span></div>
            </div>
        </section>
    </div>

    <!-- Toast Alert Container -->
    <div id="toast" class="toast"></div>

    <script>
        const DEFAULT_SUPABASE_URL = 'https://eeyiragtylotiwozbgqp.supabase.co';
        const DEFAULT_SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVleWlyYWd0eWxvdGl3b3piZ3FwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkzNzAyNzYsImV4cCI6MjA5NDk0NjI3Nn0.YB_alc7kt5l09eTfNH0x5q-ayBx-dHS1qE-yzHbRTFg';

        let supabaseClient;
        let adminPasscode = 'admin123'; // fallback default passcode

        // Initialize Supabase Client dynamically
        function initSupabase() {
            let url = localStorage.getItem('supabase_url');
            let key = localStorage.getItem('supabase_key');
            if (!url || url === 'undefined' || url === 'null' || url.trim() === '') url = DEFAULT_SUPABASE_URL;
            if (!key || key === 'undefined' || key === 'null' || key.trim() === '') key = DEFAULT_SUPABASE_KEY;
            
            supabaseClient = supabase.createClient(url, key);
        }

        // Show toast alert
        function showToast(message, isSuccess = true) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = `toast show ${isSuccess ? 'toast-success' : 'toast-error'}`;
            
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        // Authenticate passcode
        async function handleAuthenticate(event) {
            event.preventDefault();
            const btn = document.getElementById('auth-btn');
            const passcodeField = document.getElementById('admin-passcode-input');
            const enteredPasscode = passcodeField.value.trim();
            
            btn.disabled = true;
            btn.textContent = 'Verifying...';

            try {
                // Fetch passcode from Supabase
                const { data, error } = await supabaseClient
                    .from('app_settings')
                    .select('value')
                    .eq('key', 'admin_passcode')
                    .single();
                
                if (data && data.value) {
                    adminPasscode = data.value;
                }

                if (enteredPasscode === adminPasscode) {
                    showToast('Access Granted!');
                    document.getElementById('auth-view').classList.remove('active');
                    document.getElementById('dashboard-view').classList.add('active');
                    loadDashboardSettings();
                } else {
                    showToast('Invalid passcode', false);
                }
            } catch (err) {
                console.error(err);
                // Try fallback passcode if DB table does not exist or has RLS error
                if (enteredPasscode === 'admin123') {
                    showToast('Unlocked (using offline fallback)');
                    document.getElementById('auth-view').classList.remove('active');
                    document.getElementById('dashboard-view').classList.add('active');
                    loadDashboardSettings();
                } else {
                    showToast('Auth error. Make sure migrations are run.', false);
                }
            } finally {
                btn.disabled = false;
                btn.textContent = 'Unlock Dashboard';
            }
        }

        // Load settings onto dashboard
        async function loadDashboardSettings() {
            try {
                const { data, error } = await supabaseClient
                    .from('app_settings')
                    .select('value')
                    .eq('key', 'default_provider')
                    .single();
                
                if (data && data.value) {
                    document.getElementById('default-provider-select').value = data.value.toLowerCase();
                }
            } catch (err) {
                console.warn('Could not retrieve current default provider:', err);
            }

            try {
                const { data } = await supabaseClient
                    .from('app_settings')
                    .select('value')
                    .eq('key', 'tmdb_image_quality')
                    .single();
                if (data && data.value) {
                    document.getElementById('tmdb-quality-select').value = data.value;
                }
            } catch (err) {
                console.warn('Could not retrieve current TMDB image quality:', err);
            }
            
            // Load 4K curation
            await load4KCuration();
        }

        // ==========================================
        // 4K CURATION LOGIC
        // ==========================================
        let selectedMovies = [];

        async function load4KCuration() {
            try {
                const { data, error } = await supabaseClient
                    .from('app_settings')
                    .select('value')
                    .eq('key', '4k_movies_today')
                    .single();
                
                if (data && data.value) {
                    selectedMovies = JSON.parse(data.value);
                } else {
                    selectedMovies = [];
                }
                renderCurationList();
            } catch (err) {
                console.warn('Could not load current 4K curation:', err);
                selectedMovies = [];
                renderCurationList();
            }
        }

        async function handleSearch4K(event) {
            if (event) event.preventDefault();
            const query = document.getElementById('search-4k-input').value.trim();
            if (!query) return;

            const resultsContainer = document.getElementById('search-4k-results');
            resultsContainer.style.display = 'block';
            resultsContainer.innerHTML = '<div style="padding: 1rem; text-align: center; color: var(--bone-400); font-size: 0.9rem;">Searching...</div>';

            try {
                const res = await fetch(`https://api.themoviedb.org/3/search/movie?api_key=dfa4c2c7c1de1005adee824dc5593672&query=${encodeURIComponent(query)}&language=en-US&page=1`);
                const data = await res.json();
                const results = data.results || [];
                
                if (results.length === 0) {
                    resultsContainer.innerHTML = '<div style="padding: 1rem; text-align: center; color: var(--bone-400); font-size: 0.9rem;">No movies found</div>';
                    return;
                }

                resultsContainer.innerHTML = '';
                results.forEach(movie => {
                    const item = document.createElement('li');
                    item.className = 'search-item';
                    
                    const details = document.createElement('div');
                    details.className = 'item-details';
                    
                    const title = document.createElement('div');
                    title.className = 'item-title';
                    title.textContent = movie.title || movie.original_title;
                    
                    const meta = document.createElement('div');
                    meta.className = 'item-meta';
                    meta.textContent = movie.release_date ? movie.release_date.split('-')[0] : 'N/A';
                    
                    details.appendChild(title);
                    details.appendChild(meta);
                    
                    const addBtn = document.createElement('button');
                    addBtn.type = 'button';
                    addBtn.className = 'btn btn-sm';
                    addBtn.textContent = isAlreadyAdded(movie.id) ? 'Added' : 'Add';
                    addBtn.disabled = isAlreadyAdded(movie.id) || selectedMovies.length >= 10;
                    
                    addBtn.onclick = () => {
                        addMovieToCuration(movie);
                        addBtn.textContent = 'Added';
                        addBtn.disabled = true;
                    };
                    
                    item.appendChild(details);
                    item.appendChild(addBtn);
                    resultsContainer.appendChild(item);
                });
            } catch (err) {
                console.error(err);
                resultsContainer.innerHTML = '<div style="padding: 1rem; text-align: center; color: var(--danger); font-size: 0.9rem;">Error searching movies</div>';
            }
        }

        function isAlreadyAdded(id) {
            return selectedMovies.some(m => m.id === id);
        }

        function addMovieToCuration(movie) {
            if (selectedMovies.length >= 10) return;
            selectedMovies.push({
                id: movie.id,
                title: movie.title || movie.original_title,
                originalTitle: movie.original_title,
                posterPath: movie.poster_path,
                rating: movie.vote_average,
                releaseDate: movie.release_date,
                genreIds: movie.genre_ids,
                adult: movie.adult,
                type: 'movie'
            });
            renderCurationList();
        }

        function removeMovieFromCuration(id) {
            selectedMovies = selectedMovies.filter(m => m.id !== id);
            renderCurationList();
            
            // If search results are showing, refresh search state
            const query = document.getElementById('search-4k-input').value.trim();
            if (query) {
                handleSearch4K();
            }
        }

        function moveCurationItem(index, direction) {
            const newIndex = index + direction;
            if (newIndex < 0 || newIndex >= selectedMovies.length) return;
            const temp = selectedMovies[index];
            selectedMovies[index] = selectedMovies[newIndex];
            selectedMovies[newIndex] = temp;
            renderCurationList();
        }

        function renderCurationList() {
            const list = document.getElementById('curation-4k-list');
            list.innerHTML = '';
            
            document.getElementById('curation-count').textContent = `(${selectedMovies.length}/10)`;

            if (selectedMovies.length === 0) {
                list.innerHTML = '<li style="padding: 1.5rem; text-align: center; color: var(--bone-400); font-size: 0.9rem;">No 4K movies selected yet</li>';
                return;
            }

            selectedMovies.forEach((movie, index) => {
                const item = document.createElement('li');
                item.className = 'curation-item';
                
                const details = document.createElement('div');
                details.className = 'item-details';
                
                const title = document.createElement('div');
                title.className = 'item-title';
                title.textContent = `${index + 1}. ${movie.title}`;
                
                const meta = document.createElement('div');
                meta.className = 'item-meta';
                meta.textContent = movie.releaseDate ? movie.releaseDate.split('-')[0] : 'N/A';
                
                details.appendChild(title);
                details.appendChild(meta);
                
                const actions = document.createElement('div');
                actions.className = 'curation-actions';
                
                const upBtn = document.createElement('button');
                upBtn.type = 'button';
                upBtn.className = 'action-icon-btn';
                upBtn.textContent = '↑';
                upBtn.disabled = index === 0;
                upBtn.onclick = () => moveCurationItem(index, -1);
                
                const downBtn = document.createElement('button');
                downBtn.type = 'button';
                downBtn.className = 'action-icon-btn';
                downBtn.textContent = '↓';
                downBtn.disabled = index === selectedMovies.length - 1;
                downBtn.onclick = () => moveCurationItem(index, 1);
                
                const delBtn = document.createElement('button');
                delBtn.type = 'button';
                delBtn.className = 'action-icon-btn danger';
                delBtn.textContent = '✕';
                delBtn.onclick = () => removeMovieFromCuration(movie.id);
                
                actions.appendChild(upBtn);
                actions.appendChild(downBtn);
                actions.appendChild(delBtn);
                
                item.appendChild(details);
                item.appendChild(actions);
                list.appendChild(item);
            });
        }

        async function handleSave4K(event) {
            event.preventDefault();
            const btn = document.getElementById('save-4k-btn');
            btn.disabled = true;
            btn.textContent = 'Saving curation...';

            try {
                const { error } = await supabaseClient
                    .from('app_settings')
                    .upsert({ key: '4k_movies_today', value: JSON.stringify(selectedMovies), updated_at: new Date() }, { onConflict: 'key' });
                
                if (error) throw error;
                showToast('4K curation saved successfully!');
            } catch (err) {
                console.error(err);
                showToast('Failed to save 4K curation in Supabase', false);
            } finally {
                btn.disabled = false;
                btn.textContent = 'Save Curation';
            }
        }

        // Save Settings to database
        async function handleSaveSettings(event) {
            event.preventDefault();
            const saveBtn = document.getElementById('save-btn');
            const defaultProvider = document.getElementById('default-provider-select').value;
            const tmdbImageQuality = document.getElementById('tmdb-quality-select').value;
            const newPasscode = document.getElementById('new-passcode-input').value.trim();

            saveBtn.disabled = true;
            saveBtn.textContent = 'Saving...';

            try {
                // Save default provider
                const { error: providerError } = await supabaseClient
                    .from('app_settings')
                    .upsert({ key: 'default_provider', value: defaultProvider, updated_at: new Date() }, { onConflict: 'key' });

                if (providerError) throw providerError;

                const { error: qualityError } = await supabaseClient
                    .from('app_settings')
                    .upsert({ key: 'tmdb_image_quality', value: tmdbImageQuality, updated_at: new Date() }, { onConflict: 'key' });

                if (qualityError) throw qualityError;

                // Save new passcode if provided
                if (newPasscode) {
                    const { error: passcodeError } = await supabaseClient
                        .from('app_settings')
                        .upsert({ key: 'admin_passcode', value: newPasscode, updated_at: new Date() }, { onConflict: 'key' });
                    
                    if (passcodeError) throw passcodeError;
                    adminPasscode = newPasscode;
                    document.getElementById('new-passcode-input').value = '';
                }

                showToast('Settings updated successfully!');
            } catch (err) {
                console.error(err);
                showToast('Failed to update settings in Supabase', false);
            } finally {
                saveBtn.disabled = false;
                saveBtn.textContent = 'Save Changes';
            }
        }

        // Initialize script
        initSupabase();
    </script>
</body>
</html>
