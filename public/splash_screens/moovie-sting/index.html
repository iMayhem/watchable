<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Moovie</title>
  <link rel="stylesheet" href="/splash_screens/moovie-sting/styles.css">
</head>
<body>
  <div class="splash" aria-hidden="true">
    <div class="splash__grain"></div>
    <div class="splash__vignette"></div>
    <div class="splash__glow"></div>

    <div class="moovie-word">
      <span class="moovie-word__letter moovie-word__letter--lead" style="--i: 0">m</span>
      <span class="moovie-word__letter" style="--i: 1">o</span>
      <span class="moovie-word__letter" style="--i: 2">o</span>
      <span class="moovie-word__letter" style="--i: 3">v</span>
      <span class="moovie-word__letter" style="--i: 4">i</span>
      <span class="moovie-word__letter" style="--i: 5">e</span>
      <span class="moovie-word__sweep" aria-hidden="true"></span>
      <span class="moovie-word__flare" aria-hidden="true"></span>
    </div>

    <p class="splash__tagline">you're gonna enjoy this</p>
  </div>
</body>
</html>
